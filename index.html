<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#9b7e13">
    <title>Frutería del Terreno</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <main>
      <section id="informacion" class="panel" aria-labelledby="titulo">
        <h1 id="titulo" class="texto">Frutería</h1>
        <h2 id="subtitulo" class="texto">del terreno en casa</h2>
        <figure id="foto-principal" class="foto">
          <a
            id="contacto-whatsapp"
            href="https://wa.me/34644445369"
            aria-label="Contactar con Frutería del Terreno por WhatsApp">
            <picture id="imagen-naranjas">
              <source
                type="image/avif"
                srcset="img/naranjas-480.avif 480w, img/naranjas-960.avif 960w"
                sizes="(orientation: landscape) calc(50vw - 3.25rem), (max-width: 64rem) calc(100vw - 3.5rem), 60rem">
              <img
                src="img/Naranjas.jpeg"
                srcset="img/naranjas-480.jpg 480w, img/Naranjas.jpeg 960w"
                sizes="(orientation: landscape) calc(50vw - 3.25rem), (max-width: 64rem) calc(100vw - 3.5rem), 60rem"
                alt="Naranjas maduras en un árbol de la finca"
                fetchpriority="high">
            </picture>
            <svg
              id="icono-whatsapp"
              viewBox="0 0 64 64"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
              focusable="false">
              <path fill="#25d366" d="M32 4a27.7 27.7 0 0 0-23.7 42L4 60l14.4-3.8A28 28 0 1 0 32 4Z"/>
              <path fill="#fff" d="M32 9a22.7 22.7 0 0 0-19.4 34.5l1 1.6-2 7.2 7.4-1.9 1.5.9A22.8 22.8 0 1 0 32 9Zm12.8 32.7c-.5 1.5-2.8 2.8-4 3-1 .2-2.3.3-3.7-.1-1-.3-2.2-.7-3.8-1.4-6.7-2.9-11-9.7-11.4-10.2-.3-.5-2.7-3.6-2.7-6.9s1.7-4.9 2.3-5.6c.6-.7 1.3-.9 1.8-.9h1.3c.4 0 1 .1 1.4 1.1.5 1.2 1.8 4.4 1.9 4.7.2.3.3.7 0 1.2-.2.5-.3.7-.6 1.1-.3.4-.7.9-1 1.2-.3.3-.6.7-.2 1.3.4.7 1.8 2.9 3.9 4.7 2.7 2.4 5 3.2 5.7 3.5.7.4 1.1.3 1.5-.2.4-.5 1.7-2 2.1-2.7.5-.7.9-.6 1.5-.4.6.2 3.8 1.8 4.4 2.1.7.3 1.1.5 1.2.8.2.3.2 1.6-.3 3.1Z"/>
            </svg>
          </a>
          <figcaption>
            <p id="descripcion" class="texto">¡Reparto de Naranjas a toda España!</p>
          </figcaption>
        </figure>
      </section>
      <aside id="historia" class="panel" aria-label="Historia de la frutería"></aside>
    </main>
  </body>
</html>
