<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Frutería del Terreno a Casa</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2d3718">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <main class="tarjeta-presentacion">
        
        <!-- Títulos con ID propio para diseño y clase común para que no desborden -->
        <h1 id="titulo" class="elastico">Frutería</h1>
        <h2 id="subtitulo" class="elastico">Del Terreno a Casa</h2>
        
        <p id="descripcion" class="elastico">¡Envío de Naranjas a toda España!</p>

    </main>

    <script>
    // Esperamos a que la página cargue completa
    window.addEventListener('DOMContentLoaded', () => {
        // Buscamos cualquier elemento inyectado que contenga la palabra netlify
        setTimeout(() => {
            const sello = document.querySelector('[id*="netlify"]') || document.querySelector('[class*="netlify"]');
            if (sello) {
                sello.style.setProperty('display', 'none', 'important');
            }
        }, 300); // Pequeño retraso para pillar al script inyectado in fraganti
    });
</script>


</body>
</html>
