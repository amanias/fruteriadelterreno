<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#9b7e13">
    <title>Frutería del Terreno</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <main>
      <div class="panel">
        <figure class="foto-principal">
          <picture>
            <source
              type="image/avif"
              srcset="img/naranjas-480.avif 480w, img/naranjas-960.avif 960w"
              sizes="(orientation: landscape) calc(50vw - 3rem), (max-width: 64rem) calc(100vw - 4rem), 60rem">
            <img
              src="img/Naranjas.jpeg"
              srcset="img/naranjas-480.jpg 480w, img/Naranjas.jpeg 960w"
              sizes="(orientation: landscape) calc(50vw - 3rem), (max-width: 64rem) calc(100vw - 4rem), 60rem"
              alt="Naranjas maduras en un árbol de la finca"
              fetchpriority="high">
          </picture>
        </figure>
      </div>
      <div class="panel panel--secundario" aria-hidden="true"></div>
    </main>
  </body>
</html>
