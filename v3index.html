<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutería del Terreno</title>
    
    <meta name="theme-color" content="#2d3718">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Contenedor principal elástico con efecto cristal -->
    <main id="app-hero">
        <figure>
            <!-- Título y subtítulo de la tarjeta -->
            <h1>Frutería del Terreno</h1>
            <h2>Calidad Premium</h2>
            
            <!-- La imagen principal del producto -->
            <img src="img/Naranjas.jpeg" alt="Uvas frescas del terreno">
            
            <!-- El pie de foto que actúa como descripción del producto -->
            <figcaption>
                <p>Tu producto fresco, directo del campo a tu casa sin intermediarios.</p>
            </figcaption>
        </figure>
    </main>

</body>
</html>
